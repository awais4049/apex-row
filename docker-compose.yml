services:
  db:
    image: postgres:15-alpine
    container_name: apex-db
    restart: always
    environment:
      POSTGRES_USER: apex
      POSTGRES_PASSWORD: apexpass
      POSTGRES_DB: apexrow
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apex -d apexrow"]
      interval: 5s
      retries: 10

  web:
    image: awais49/apex-row:latest
    container_name: apex-web
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://apex:apexpass@db:5432/apexrow
      PORT: 3000
    ports:
      - "8200:3000"

volumes:
  pgdata: