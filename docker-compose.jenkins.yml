services:
  db:
    image: postgres:15-alpine
    container_name: apex-ci-db
    environment:
      POSTGRES_USER: apex
      POSTGRES_PASSWORD: apexpass
      POSTGRES_DB: apexrow
    ports:
      - "5434:5432"
    volumes:
      - ci_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apex -d apexrow"]
      interval: 5s
      retries: 10

  web:
    image: node:18-alpine
    container_name: apex-ci-web
    working_dir: /app
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://apex:apexpass@db:5432/apexrow
      PORT: 3000
    volumes:
      - ./:/app
    command: sh -c "npm install && npm start"
    ports:
      - "8100:3000"

volumes:
  ci_pgdata: